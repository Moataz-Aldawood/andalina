<an-attribute name="title" default-value="Default Card Title"></an-attribute>
<an-attribute name="description" default-value="This is a simple card description."></an-attribute>

<div class="card">
    <h3>{{ title }}</h3>
    <p>{{ description }}</p>
</div>

<style>
.card {
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 20px;
    background: #ffffff;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 12px rgba(0,0,0,0.1);
}
.card h3 {
    margin-top: 0;
    color: #333333;
    font-size: 1.2rem;
}
.card p {
    color: #666666;
    line-height: 1.5;
    margin-bottom: 0;
}
</style>
