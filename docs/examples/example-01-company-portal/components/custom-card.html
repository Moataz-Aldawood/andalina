<an-component-def>
<an-body>
<!-- an-comment: Reusable Card Component -->
<div class="ui-card">
   <div class="ui-card-header">
      <h3 class="ui-card-title">
         <an-place name="title">Default Component Card</an-place>
      </h3>
      <span class="badge">
         <an-place name="badge">Standard</an-place>
      </span>
   </div>
   <div class="ui-card-body">
      <an-place name="body">
         This card is using the default description fallback value. You can override this content using slot="body".
      </an-place>
   </div>
   <div>
      <an-place name="action">
         <button class="btn btn-outline">Learn More</button>
      </an-place>
   </div>
</div>

</an-body>
</an-component-def>
