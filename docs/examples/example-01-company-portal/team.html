<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Team Grid | Andalina Company Portal</title>
   
   <an-include src="./partials/styles.html"></an-include>
   <script src="../lib/andalina.js" defer></script>

   <!-- Google tag (gtag.js) -->
   <script async src="https://www.googletagmanager.com/gtag/js?id=G-9CQ8C1189H"></script>
   <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9CQ8C1189H');

            // Enhanced download and link click tracking (with navigation delay for accuracy)
      document.addEventListener('click', function (e) {
         const link = e.target.closest('a');
         if (!link) return;
         
         const href = link.getAttribute('href') || '';
         const linkText = link.innerText.trim() || 'Link';
         const isZip = href.includes('.zip');
         const isDownload = isZip || href.includes('download') || link.classList.contains('ti-download') || link.querySelector('.ti-download');
         
         const isAnchor = href.startsWith('#');
         const isBlank = link.target === '_blank';

         if (isZip) {
            gtag('event', 'zip_file_download', {
               'event_category': 'Downloads',
               'event_label': linkText,
               'file_name': href,
               'value': 1
            });
         }
         
         if (isDownload) {
            if (!isZip && !isAnchor && !isBlank) {
               e.preventDefault();
               let navigated = false;
               const navigate = () => {
                  if (!navigated) {
                     navigated = true;
                     window.location.href = href;
                  }
               };
               
               gtag('event', 'download_click', {
                  'event_category': 'Downloads',
                  'event_label': linkText,
                  'link_url': href,
                  'is_zip': isZip,
                  'event_callback': navigate
               });
               setTimeout(navigate, 400); // Fallback timeout
            } else {
               gtag('event', 'download_click', {
                  'event_category': 'Downloads',
                  'event_label': linkText,
                  'link_url': href,
                  'is_zip': isZip
               });
            }
         }
         
         gtag('event', 'link_click', {
            'event_category': 'Navigation',
            'event_label': linkText,
            'link_url': href
         });
      });
   </script>

   <!-- Pre-fetch team data -->
   <an-data src="data/team.json" name="team"></an-data>
</head>
<body>

   <!-- an-comment: Master Page Layout combined with an-repeat grid -->
   <an-layout src="./layouts/master.html">
      <an-inject name="content">
         <h1 class="page-title">Team Roster Grid</h1>
         <p class="page-subtitle">
            This page demonstrates combining <code>&lt;an-layout&gt;</code> with <code>&lt;an-repeat&gt;</code> to render a responsive grid of reusable employee cards.
         </p>

         <section class="section-card">
            <div class="section-header">
               <h2 class="section-title">Core Engineering & Leadership Roster</h2>
               <span class="badge">Grid Layout + Repeat</span>
            </div>

            <!-- an-comment: Responsive Grid filled via an-repeat -->
            <div class="card-grid">
               <an-repeat data="team" item="member">
                  <an-component src="./components/user-card.html">
                     <an-inject name="avatar">{{ member.avatar }}</an-inject>
                     <an-inject name="name">{{ member.name }}</an-inject>
                     <an-inject name="role">{{ member.role }}</an-inject>
                     <an-inject name="bio">{{ member.bio }}</an-inject>
                  </an-component>
               </an-repeat>
            </div>
         </section>
      </an-inject>
   </an-layout>

</body>
</html>
