<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Example 2: Modern Product Catalog | Andalina Storefront</title>
   
   <link rel="stylesheet" href="css/style.css">
   <script src="../lib/andalina.js" defer></script>

   <!-- Google tag (gtag.js) -->
   <script async src="https://www.googletagmanager.com/gtag/js?id=G-9CQ8C1189H"></script>
   <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9CQ8C1189H');

            // Enhanced download and link click tracking (with navigation delay for accuracy)
      document.addEventListener('click', function (e) {
         const link = e.target.closest('a');
         if (!link) return;
         
         const href = link.getAttribute('href') || '';
         const linkText = link.innerText.trim() || 'Link';
         const isZip = href.includes('.zip');
         const isDownload = isZip || href.includes('download') || link.classList.contains('ti-download') || link.querySelector('.ti-download');
         
         const isAnchor = href.startsWith('#');
         const isBlank = link.target === '_blank';

         if (isZip) {
            gtag('event', 'zip_file_download', {
               'event_category': 'Downloads',
               'event_label': linkText,
               'file_name': href,
               'value': 1
            });
         }
         
         if (isDownload) {
            if (!isZip && !isAnchor && !isBlank) {
               e.preventDefault();
               let navigated = false;
               const navigate = () => {
                  if (!navigated) {
                     navigated = true;
                     window.location.href = href;
                  }
               };
               
               gtag('event', 'download_click', {
                  'event_category': 'Downloads',
                  'event_label': linkText,
                  'link_url': href,
                  'is_zip': isZip,
                  'event_callback': navigate
               });
               setTimeout(navigate, 400); // Fallback timeout
            } else {
               gtag('event', 'download_click', {
                  'event_category': 'Downloads',
                  'event_label': linkText,
                  'link_url': href,
                  'is_zip': isZip
               });
            }
         }
         
         gtag('event', 'link_click', {
            'event_category': 'Navigation',
            'event_label': linkText,
            'link_url': href
         });
      });
   </script>

   <!-- Pre-fetch product data -->
   <an-data src="data/products.json" name="catalog"></an-data>
</head>
<body>

   <an-layout src="./layouts/store-layout.html">
      <an-inject name="content">
         <div class="hero-banner">
            <h1 class="hero-title">Next-Gen SaaS Catalog</h1>
            <p class="hero-subtitle">
               A responsive e-commerce storefront built with <code>&lt;an-layout&gt;</code>, <code>&lt;an-repeat&gt;</code>, and glassmorphic component cards with default slot fallbacks.
            </p>
         </div>

         <div class="product-grid">
            <an-repeat data="catalog" item="product">
               <an-component src="./components/product-card.html">
                  <an-inject name="icon">{{ product.icon }}</an-inject>
                  <an-inject name="category">{{ product.category }}</an-inject>
                  <an-inject name="badge">{{ product.badge }}</an-inject>
                  <an-inject name="title">{{ product.title }}</an-inject>
                  <an-inject name="desc">{{ product.desc }}</an-inject>
                  <an-inject name="price">{{ product.price }}</an-inject>
                  <an-inject name="button">{{ product.button }}</an-inject>
               </an-component>
            </an-repeat>
         </div>
      </an-inject>
   </an-layout>

</body>
</html>
