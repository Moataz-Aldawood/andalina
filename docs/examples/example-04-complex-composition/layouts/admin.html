<an-layout-def>
<an-body>
<div style="background: #0f172a; border-bottom: 1px solid #1e293b; padding: 0.75rem 2rem; display: flex; justify-content: space-between; align-items: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 0.9rem; margin: 0; position: sticky; top: 0; z-index: 9999;">
   <div style="font-weight: 800; font-size: 1.1rem; background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Andalina Examples Hub</div>
   <div>
      <a href="../index.html" style="color: #94a3b8; text-decoration: none; margin-right: 1.5rem; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#94a3b8'">&larr; Back to Hub</a>
      <a href="https://github.com/Moataz-Aldawood/andalina/tree/main/docs/examples/example-04-complex-composition" target="_blank" style="background: rgba(255,255,255,0.1); color: #fff; padding: 0.5rem 1rem; border-radius: 0.375rem; text-decoration: none; font-weight: 600; transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">View Source Code</a>
   </div>
</div>
<div class="admin-wrapper">
   <aside class="sidebar">
      <div class="brand">Admin Dashboard</div>
      <nav class="side-nav">
         <a href="index.html" class="active">Overview</a>
         <a href="../index.html" style="color: #64748b; margin-top: 2rem;">← Back to Examples</a>
         <a href="https://github.com/Moataz-Aldawood/andalina/tree/main/docs/examples/example-04-complex-composition" target="_blank" style="color: #64748b;">Source Code</a>
      </nav>
   </aside>
   <main class="main-content">
      <header class="topbar">
         <div class="page-title"><an-place name="pageTitle">Dashboard</an-place></div>
         <div class="user-profile">{{ dashboard.user.name }} ({{ dashboard.user.role }})</div>
      </header>
      <div class="content-area">
         <an-place name="content"></an-place>
      </div>
   </main>
</div>
</an-body>
</an-layout-def>
