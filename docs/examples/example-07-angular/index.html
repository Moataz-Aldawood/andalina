<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>Angular Integration | Andalina</title>
   
   <style>
      body {
         font-family: system-ui, -apple-system, sans-serif;
         margin: 0; background: #0f172a; color: #f8fafc;
         padding: 2rem;
      }
      .container { max-width: 800px; margin: 0 auto; }
      .angular-container {
         background: #1e293b; border: 1px solid #dd0031; border-radius: 0.5rem;
         padding: 2rem; text-align: center;
      }
      .back-link { color: #94a3b8; text-decoration: none; margin-bottom: 2rem; display: inline-block; }
      .back-link:hover { color: #f8fafc; }
   </style>
   
   <!-- Andalina -->
   <script src="../lib/andalina.js" defer></script>
   
   <!-- AngularJS for a simple client-side example without a build step -->
   <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body>

   <div class="container">
      <a href="../index.html" class="back-link">← Back to Examples</a>
      <a href="https://github.com/Moataz-Aldawood/andalina/tree/main/examples/example-07-angular" target="_blank" class="back-link" style="margin-left: 1rem;">Source Code</a>
      
      <h1 style="color: #dd0031;">Andalina + AngularJS</h1>
      
      <p style="margin-bottom: 2rem; color: #94a3b8;">
         This page demonstrates how to safely bootstrap an Angular application inside a layout rendered by Andalina. 
         We listen for the <code>andalina:ready</code> event before calling <code>angular.bootstrap()</code>.
      </p>

      <!-- The container for our Angular app -->
      <div id="angular-root" class="angular-container">
         <div ng-controller="MainController">
            <h3 style="color: #fca5a5;">Angular Controller</h3>
            <p>Welcome, {{ user.name }}!</p>
            <input type="text" ng-model="user.name" style="padding: 0.5rem; border-radius: 0.25rem; border: none;">
         </div>
      </div>
   </div>

   <script>
      // 1. Define your Angular module
      const app = angular.module('myApp', []);
      app.controller('MainController', function($scope) {
         $scope.user = { name: 'Andalina User' };
      });

      // 2. Wait for Andalina to finish parsing the DOM
      document.addEventListener('andalina:ready', function() {
         console.log("Andalina is ready. Bootstrapping Angular...");
         const rootNode = document.getElementById('angular-root');
         if (rootNode) {
            // Manually bootstrap angular instead of using ng-app
            angular.bootstrap(rootNode, ['myApp']);
         }
      });
   </script>

</body>
</html>
