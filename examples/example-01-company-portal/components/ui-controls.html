<!-- Component Library: Reusable Buttons, Cards, and Text Fields with default values -->

<!-- 1. Reusable Button Component -->
<an-template id="custom-btn">
   <button class="btn btn-primary">
      <an-slot name="icon"><span>⚡</span></an-slot>
      <an-slot name="label">Default Button Text</an-slot>
   </button>
</an-template>

<!-- 2. Reusable Card Component -->
<an-template id="custom-card">
   <div class="ui-card">
      <div class="ui-card-header">
         <h3 class="ui-card-title">
            <an-slot name="title">Default Component Card</an-slot>
         </h3>
         <span class="badge">
            <an-slot name="badge">Standard</an-slot>
         </span>
      </div>
      <div class="ui-card-body">
         <an-slot name="body">
            This card is using the default description fallback value. You can override this content using slot="body".
         </an-slot>
      </div>
      <div>
         <an-slot name="action">
            <button class="btn btn-outline">Learn More</button>
         </an-slot>
      </div>
   </div>
</an-template>

<!-- 3. Reusable Text Field Component -->
<an-template id="text-field">
   <div class="form-group">
      <label class="form-label">
         <an-slot name="label">Default Input Label</an-slot>
      </label>
      <input type="text" class="form-input" placeholder="Enter default text..." />
      <span class="form-helper">
         <an-slot name="helper">Default helper note for this field.</an-slot>
      </span>
   </div>
</an-template>
