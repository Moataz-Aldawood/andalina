<!-- Mid Template uses the Super Master -->
<an-page-template src="super-master.html">
    
    <!-- Pass styles up to the master's head! -->
    <an-inject name="head-assets">
        <style>
            .mid-layout { background: #333; border-radius: 8px; padding: 30px; width: 100%; max-width: 800px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
            .mid-title { color: #e74c3c; border-bottom: 1px solid #444; padding-bottom: 10px; margin-top: 0; }
        </style>
    </an-inject>

    <!-- Fill the master's layout-slot -->
    <an-inject name="layout-slot">
        <div class="mid-layout">
            <h2 class="mid-title">Middle Wrapper Structure</h2>
            
            <div style="padding: 20px; background: #2a2a2a; border-radius: 4px; margin-top: 20px;">
                <!-- Define a NEW slot for the deepest child to fill! -->
                <an-place name="page-content"></an-place>
            </div>
            
        </div>
    </an-inject>

</an-page-template>
